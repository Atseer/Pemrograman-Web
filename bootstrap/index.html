<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Akun Modern</title>
  
  <!-- Library Eksternal (Bootstrap CSS & Icons) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- File CSS Kustom -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container d-flex justify-content-center align-items-center">
    <div class="card auth-card p-4 p-sm-5">
      
      <!-- Logo & Header -->
      <div class="text-center mb-4">
        <div class="brand-icon mb-2">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3 class="fw-bold text-dark m-0">Portal Akun</h3>
      </div>

      <!-- Tab Switcher Navigasi -->
      <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Masuk</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Daftar</button>
        </li>
      </ul>

      <!-- Konten Tab -->
      <div class="tab-content" id="pills-tabContent">
        
        <!-- TAB LOGIN -->
        <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
          <form id="loginForm" action="dashboard.html" method="GET">
            <!-- Email -->
            <div class="form-floating mb-3 position-relative">
              <i class="bi bi-envelope input-icon"></i>
              <input type="email" class="form-control" id="loginEmail" placeholder="nama@email.com" required>
              <label for="loginEmail">Alamat Email</label>
            </div>

            <!-- Password -->
            <div class="form-floating mb-3 position-relative">
              <i class="bi bi-key input-icon"></i>
              <input type="password" class="form-control" id="loginPassword" placeholder="Kata Sandi" required>
              <label for="loginPassword">Kata Sandi</label>
              <i class="bi bi-eye-slash toggle-password" data-target="loginPassword"></i>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted small" for="rememberMe">Ingat saya</label>
              </div>
              <a href="#" class="text-decoration-none small fw-semibold link-purple">Lupa kata sandi?</a>
            </div>

            <button type="submit" class="btn btn-gradient w-100 mb-3">Masuk Sekarang</button>
          </form>

          <div class="divider">atau masuk dengan</div>

          <!-- Tombol Login Sosial Media -->
          <div class="row g-2">
            <div class="col-6">
              <button type="button" class="btn btn-social w-100 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-google text-danger"></i> Google
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn btn-social w-100 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-github text-dark"></i> GitHub
              </button>
            </div>
          </div>
        </div>

        <!-- TAB REGISTER -->
        <div class="tab-pane fade" id="pills-register" role="tabpanel">
          <form id="registerForm" action="dashboard.html" method="GET">
            <!-- Nama Lengkap -->
            <div class="form-floating mb-3 position-relative">
              <i class="bi bi-person input-icon"></i>
              <input type="text" class="form-control" id="registerName" placeholder="Nama Lengkap" required>
              <label for="registerName">Nama Lengkap</label>
            </div>

            <!-- Email -->
            <div class="form-floating mb-3 position-relative">
              <i class="bi bi-envelope input-icon"></i>
              <input type="email" class="form-control" id="registerEmail" placeholder="nama@email.com" required>
              <label for="registerEmail">Alamat Email</label>
            </div>

            <!-- Password -->
            <div class="form-floating mb-3 position-relative">
              <i class="bi bi-key input-icon"></i>
              <input type="password" class="form-control" id="registerPassword" placeholder="Kata Sandi" required>
              <label for="registerPassword">Kata Sandi</label>
              <i class="bi bi-eye-slash toggle-password" data-target="registerPassword"></i>
            </div>

            <!-- Konfirmasi Password -->
            <div class="form-floating mb-3 position-relative">
              <i class="bi bi-check2-circle input-icon"></i>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Konfirmasi Kata Sandi" required>
              <label for="confirmPassword">Konfirmasi Kata Sandi</label>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="termsCheck" required>
              <label class="form-check-label text-muted small" for="termsCheck">
                Saya setuju dengan <a href="#" class="text-decoration-none fw-semibold link-purple">Syarat & Ketentuan</a>
              </label>
            </div>

            <button type="submit" class="btn btn-gradient w-100">Buat Akun Baru</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- Library JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- File JS Kustom -->
  <script src="script.js"></script>
</body>
</html>
