<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title> 
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
 
  <header class="navbar">
    <div class="brand">
      <i class="fa-solid fa-graduation-cap brand-icon"></i>
      <span>EduAdmin</span>
    </div>
    <nav class="nav-menu">
      <a href="#" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="#"><i class="fa-solid fa-user-graduate"></i> Mahasiswa</a>
      <a href="#"><i class="fa-solid fa-book-open"></i> Jurusan</a>
      <a href="#"><i class="fa-solid fa-gear"></i> Pengaturan</a>
    </nav>
  </header>


  <main class="container">
 
    <section class="card form-card">
      <div class="card-header">
        <h2 id="form-title"><i class="fa-solid fa-user-plus"></i> Tambah Mahasiswa</h2>
        <p class="subtitle">Isi data mahasiswa dengan lengkap dan benar</p>
      </div>

      <form id="student-form">
        <input type="hidden" id="student-id" value="">

        <div class="form-group">
          <label for="nim">NIM</label>
          <input type="text" id="nim" placeholder="Contoh: 230101001" required>
        </div>

        <div class="form-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" placeholder="Masukkan nama mahasiswa" required>
        </div>

        <div class="form-group">
          <label for="major">Program Studi</label>
          <select id="major" required>
            <option value="">-- Pilih Jurusan --</option>
            <option value="Teknik Informatika">Teknik Informatika</option>
            <option value="Sistem Informasi">Sistem Informasi</option>
            <option value="Teknik Komputer">Teknik Komputer</option>
            <option value="Data Science">Data Science</option>
            <option value="Desain Komunikasi Visual">Desain Komunikasi Visual</option>
          </select>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nama@mahasiswa.ac.id" required>
        </div>

        <div class="form-group">
          <label for="gender">Jenis Kelamin</label>
          <select id="gender" required>
            <option value="">-- Pilih Jenis Kelamin --</option>
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
          </select>
        </div>

        <div class="form-group">
          <label for="year">Angkatan</label>
          <input type="number" id="year" min="2018" max="2026" placeholder="2023" required>
        </div>

        <div class="form-actions">
          <button type="submit" id="btn-save" class="btn btn-primary">
            <i class="fa-solid fa-floppy-disk"></i> Simpan Data
          </button>
          <button type="button" id="btn-cancel" class="btn btn-secondary" style="display: none;">
            <i class="fa-solid fa-xmark"></i> Batal
          </button>
        </div>
      </form>
    </section>
 
    <section class="card data-card">
      <div class="table-header">
        <div>
          <h2><i class="fa-solid fa-list"></i> Data Mahasiswa</h2>
          <p class="subtitle">Daftar seluruh mahasiswa aktif terdaftar</p>
        </div>
 
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Cari NIM, Nama, Prodi...">
          <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
      </div>

 
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>NIM</th>
              <th>Nama</th>
              <th>Prodi</th>
              <th>Email</th>
              <th>Angkatan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="student-table-body"> 
          </tbody>
        </table>
      </div>
 
      <div class="table-footer">
        <div class="total-info" id="total-info">Total Data: 0</div>
        <div class="pagination" id="pagination"> 
        </div>
      </div>
    </section>

  </main>
 
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <i class="fa-solid fa-triangle-exclamation warning-icon"></i>
        <h3>Konfirmasi Hapus</h3>
      </div>
      <p id="modal-text">Apakah Anda yakin ingin menghapus data mahasiswa ini?</p>
      <div class="modal-actions">
        <button id="btn-confirm-delete" class="btn btn-danger">Hapus</button>
        <button id="btn-cancel-delete" class="btn btn-secondary">Batal</button>
      </div>
    </div>
  </div>
 
  <script src="js/app.js"></script>
</body>
</html>
